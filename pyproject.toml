[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mj_hackz"
version = "0.1.0"
description = "A toolbox for listing information of generated images in MidJourney."
authors = [
    { name = "Michael Steffen", email = "miyels@proton.me" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["midjourney", "images", "metadata", "extracting", "crawling"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "google-api-python-client",
    "google-generativeai",
    "pandas",
    "pillow",
    "requests",
    "python-dotenv"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.urls]
"Documentation" = "https://github.com/msmiyels/projects-mj_hackz#readme"
"Source Code" = "https://github.com/msmiyels/projects-mj_hackz"
"Bug Tracker" = "https://github.com/msmiyels/projects-mj_hackz/issues"

[tool.setuptools.packages.find]
where = ["src/python"]